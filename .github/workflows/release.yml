name: Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to Maven Central and create the GitHub release"
        required: true
        default: false
        type: boolean

env:
  CH_VERSION: "25.8"

jobs:
  release:
    name: Verify release artifacts
    runs-on: "ubuntu-latest"
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
      - name: Read release version
        id: version
        shell: bash
        run: |
          python3 scripts/release/validate_version.py
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Install JDKs and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            11
            17
          cache: 'maven'
      - name: Setup Toolchain
        shell: bash
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/toolchains.xml" << EOF
          <?xml version="1.0" encoding="UTF8"?>
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>11</version>
              </provides>
              <configuration>
                <jdkHome>${JAVA_HOME_11_X64}</jdkHome>
              </configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
              <provides>
                <version>17</version>
              </provides>
              <configuration>
                <jdkHome>${JAVA_HOME_17_X64}</jdkHome>
              </configuration>
            </toolchain>
          </toolchains>
          EOF
      - name: Verify release build
        env:
          TEST_CLICKHOUSE_IMAGE_VERSION: ${{ env.CH_VERSION }}
        run: |
          mvn --batch-mode --no-transfer-progress \
            -Drevision="${{ steps.version.outputs.version }}" \
            -Dgpg.skip=true -DskipITs \
            -P release clean verify
      - name: Inventory release artifacts
        run: |
          python3 scripts/release/inventory_artifacts.py \
            --version "${{ steps.version.outputs.version }}"
      - name: Upload dry-run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: release-assets/
          if-no-files-found: error

  publish:
    name: Publish verified release
    needs: release
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out verified commit
        uses: actions/checkout@v4
      - name: Download verified release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.release.outputs.version }}
          path: release-assets
      - name: Install JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - name: Configure Maven Central signing
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Set up JDK toolchain
        shell: bash
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/toolchains.xml" << EOF
          <?xml version="1.0" encoding="UTF8"?>
          <toolchains>
            <toolchain>
              <type>jdk</type>
              <provides><version>11</version></provides>
              <configuration><jdkHome>${JAVA_HOME_11_X64}</jdkHome></configuration>
            </toolchain>
            <toolchain>
              <type>jdk</type>
              <provides><version>17</version></provides>
              <configuration><jdkHome>${JAVA_HOME_17_X64}</jdkHome></configuration>
            </toolchain>
          </toolchains>
          EOF
      - name: Publish verified version to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn --batch-mode --no-transfer-progress \
            -Drevision="${{ needs.release.outputs.version }}" \
            -DskipTests \
            -P release deploy
      - name: Create RC or GA GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.release.outputs.version }}"
          release_flags=(--generate-notes --target "$GITHUB_SHA")
          if [[ "$version" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          else
            release_flags+=(--latest)
          fi
          gh release create "v${version}" \
            --title "Release v${version}" \
            "${release_flags[@]}" \
            release-assets/*
  # Mirror Tableau TDVT after release (non-blocking).
  tdvt:
    name: "Tableau TDVT"
    needs: publish
    if: ${{ needs.publish.result == 'success' && startsWith(github.repository, 'ClickHouse/') }}
    runs-on: "ubuntu-latest"
    timeout-minutes: 150 # the TDVT matrix (latest/head/cloud, single-threaded) runs ~1h; allow for a queue
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
      - name: Mint a token for the TDVT repo (dispatch + read the run)
        id: tdvt-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.WORKFLOW_AUTH_PUBLIC_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_AUTH_PUBLIC_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: "clickhouse-tableau-tdvt"
      - name: Run Tableau TDVT and mirror its result
        env:
          GH_TOKEN: ${{ steps.tdvt-token.outputs.token }}
        run: |
          python3 .github/scripts/mirror_tdvt.py \
            --event-type jdbc-release \
            --version "$(cat VERSION)" \
            --correlation-id "${{ github.repository }}#${{ github.run_id }}-${{ github.run_attempt }}"
