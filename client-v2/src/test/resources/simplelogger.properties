org.slf4j.simpleLogger.defaultLogLevel=debug
org.slf4j.simpleLogger.log.com.clickhouse.client=debug
# Parsed Apache header diagnostics can include Authorization, so keep that category at INFO.
# Raw wire logging is deliberately DEBUG to exercise client-v2's connection-level suppression.
org.slf4j.simpleLogger.log.org.apache.hc.client5.http.headers=info
org.slf4j.simpleLogger.log.org.apache.hc.client5.http.wire=debug
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss:SSS Z
org.slf4j.simpleLogger.showThreadName=true
org.slf4j.simpleLogger.showLogName=true
org.slf4j.simpleLogger.showShortLogName=true
