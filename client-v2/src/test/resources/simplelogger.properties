org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.log.com.clickhouse.client=info
# Apache HttpClient logs every request header, including Authorization, at DEBUG.
# Keep these loggers at INFO so that credentials never reach the test output.
org.slf4j.simpleLogger.log.org.apache.hc.client5.http.headers=info
org.slf4j.simpleLogger.log.org.apache.hc.client5.http.wire=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss:SSS Z
org.slf4j.simpleLogger.showThreadName=true
org.slf4j.simpleLogger.showLogName=true
org.slf4j.simpleLogger.showShortLogName=true
