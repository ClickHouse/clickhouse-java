# Descriptions of the client and driver properties that Driver#getPropertyInfo returns
# (java.sql.DriverPropertyInfo#description).
#
# Keys are the property keys of com.clickhouse.client.api.ClientConfigProperties (client-v2) and
# com.clickhouse.jdbc.DriverProperties (jdbc-v2). Each key must have one entry. JdbcConfigurationTest fails when
# a property has no entry, or when an entry has no property.
#
# The descriptions state what the code does. The properties are also documented in:
# - docs/integration-jdbc.md
# - docs/clickhouse-docs/jdbc.mdx (Connection Properties)
# - docs/clickhouse-docs/client.mdx (Client Configuration)
#
# The file is read with java.util.Properties: a backslash starts an escape sequence. Maven filters the resources of
# jdbc-v2, so do not use the dollar-brace or the at-sign delimiters in a description.

# ClientConfigProperties (client-v2)
session_db_roles=Comma-separated list of roles that the server applies to each query.
clickhouse_setting_log_comment=Comment that the server writes to system.query_log for each query (server setting log_comment).
http_use_basic_auth=Sends the user and the password with HTTP Basic authentication. Set to false to send them in the X-ClickHouse-User and X-ClickHouse-Key headers.
user=User name for authentication.
password=Password for authentication.
max_open_connections=Maximum number of open connections to one server in the connection pool.
http_keep_alive_timeout=HTTP keep-alive timeout in milliseconds. It overrides the keep-alive timeout of the server. When it is not set, the client uses the server value.
use_server_time_zone=Uses the server time zone to decode Date and DateTime values.
use_time_zone=Time zone ID that the client uses to decode Date and DateTime values instead of the server time zone.
server_version=Server version that Client#getServerVersion() of client-v2 returns before the client reads the version from the server. The JDBC driver does not use it.
server_time_zone=Time zone ID of the server. The client uses it to decode Date and DateTime values when use_server_time_zone is true and the server response does not give a time zone.
async=Runs each operation in a separate thread.
connection_ttl=Time in milliseconds that a connection can stay in the connection pool. After this time, the pool does not reuse the connection. -1 means no limit.
connection_timeout=Timeout in milliseconds to open a connection to the server.
connection_reuse_strategy=Order in which the connection pool reuses idle connections. Choices: FIFO, LIFO.
socket_timeout=Timeout in milliseconds to wait for data from the server. 0 means no timeout.
socket_rcvbuf=Socket receive buffer size in bytes (SO_RCVBUF). When it is not set, the operating system sets and tunes the size.
socket_sndbuf=Socket send buffer size in bytes (SO_SNDBUF). When it is not set, the operating system sets and tunes the size.
socket_reuseaddr=Reserved for the socket option SO_REUSEADDR. The client does not apply it.
socket_keepalive=Reserved for the socket option SO_KEEPALIVE. The client does not apply it.
socket_tcp_nodelay=Sets the socket option TCP_NODELAY. This disables the Nagle algorithm.
socket_linger=Socket linger time in seconds (SO_LINGER).
database=Default database for operations.
compress=Asks the server to compress the response data.
decompress=Compresses the request data that the client sends to the server.
client.use_http_compression=Uses HTTP compression. The Content-Encoding and Accept-Encoding headers control the compression of requests and responses.
compression.lz4.uncompressed_buffer_size=Size in bytes of the buffer for uncompressed data in block compression and decompression (LZ4 and ZSTD).
compression.method=Compression method for the request data that the client sends. Choices: LZ4, ZSTD.
disable_native_compression=Uses the Java implementation of LZ4 instead of the native implementation.
proxy_type=Type of the proxy server, in upper case. Choices: HTTP, SOCKS.
proxy_host=Host name or IP address of the proxy server.
proxy_port=Port of the proxy server.
proxy_user=User name for authentication with the HTTP proxy server.
proxy_password=Password for authentication with the HTTP proxy server.
max_execution_time=Maximum time in milliseconds that the client waits for the result of a blocking operation, for example ping or queryAll. 0 means no limit. The client does not send it to the server. For the server limit, use clickhouse_setting_max_execution_time (seconds).
trust_store=Path to the trust store file that the client uses to verify the server certificate.
key_store_type=Type of the trust store file, for example JKS or PKCS12.
ssl_key_store=Reserved. The client does not use this property.
key_store_password=Password of the trust store file.
ssl_key=File path or PEM content of the private key of the client certificate.
sslrootcert=File path or PEM content of the CA certificate that the client uses to verify the server certificate.
sslcert=File path or PEM content of the client certificate for mutual TLS and for SSL authentication.
ssl_mode=How the client verifies the server on secure connections. Choices: STRICT, VERIFY_CA, TRUST, DISABLED. The JDBC driver also accepts none for TRUST.
ssl_context=A javax.net.ssl.SSLContext object for secure connections. Set it with Properties.put(). A string value is not accepted.
retry=Maximum number of retries for the failure causes in client_retry_on_failures.
format=Default data format of query results.
max_threads_per_client=Reserved. The client does not use this property.
query_id=Query ID that the client sends with the request.
client_network_buffer_size=Size in bytes of the buffer that copies data between the socket and the application.
access_token=Access token for authentication. The client sends it as is in the HTTP Authorization header.
ssl_authentication=Uses the client certificate (sslcert) for authentication with the server.
connection_pool_enabled=Enables the connection pool.
connection_request_timeout=Timeout in milliseconds to get a connection from the connection pool.
client_retry_on_failures=Comma-separated list of failure causes that the client retries. The values are the names of ClientFaultCause constants. None disables the retries.
client_name=Name of the application. The client sends it at the start of the User-Agent header.
product_name=Deprecated. Use client_name.
bearer_token=Bearer token for authentication. The client sends it in the HTTP Authorization header after the Bearer prefix.
app_compressed_data=Tells the client that the application compresses the data that it inserts.
metrics_name=Name of the group of the connection pool metrics.
client.http.cookies_enabled=Keeps the HTTP cookies from the server and sends them back to the server.
client_allow_binary_reader_to_reuse_buffers=Lets the binary format reader reuse its buffers for numbers. This decreases memory allocation.
type_hint_mapping=Mapping of ClickHouse data types to the Java classes that the binary readers of client-v2 use for values. The JDBC driver sets its own mapping. Use jdbc_type_mappings.
binary_string_support=Reads String and FixedString columns into byte arrays instead of String objects.
ssl_socket_sni=Server name for SNI (Server Name Indication) on each SSL socket. When it is set, the client also sends this name in the Host header and does not verify the host name in the server certificate.
client.http.use_form_request_for_query=Sends a query that has parameters as HTTP form data in the request body. This works only with server compression.
json_disable_number_quoting=For JSONEachRow queries, asks the server to write large integer, floating-point and decimal values as JSON numbers instead of quoted strings.
custom_settings_prefix=Prefix of custom server settings. It must agree with the server configuration.
ssl_cipher_suites=Comma-separated list of TLS cipher suites that the client can use. When it is not set, the client uses the default cipher suites of the transport.
client_id_metadata=Comma-separated key=value pairs that the client adds to the comment part of the User-Agent header.

# DriverProperties (jdbc-v2)
jdbc_ignore_unsupported_values=Ignores unsupported JDBC methods and values. When it is false, the driver throws SQLFeatureNotSupportedException.
jdbc_schema_term=Value that DatabaseMetaData.getSchemaTerm() returns. Only schema is supported.
ssl=Uses HTTPS for the connection. It is not necessary when the URL has the https protocol.
default_query_settings=Comma-separated key=value server settings that the driver sends with each query.
beta.row_binary_for_simple_insert=Beta. Uses the RowBinary writer for a PreparedStatement with a simple INSERT INTO table VALUES (?, ?, ...) statement.
jdbc_resultset_auto_close=Closes the current ResultSet of a Statement before the Statement runs the next query.
jdbc_use_max_result_rows=Makes Statement.setMaxRows() and setLargeMaxRows() send the limit as the server setting max_result_rows with result_overflow_mode=break. This overrides the overflow mode that the user sets.
jdbc_sql_parser=SQL parser of the driver. Choices: ANTLR4, ANTLR4_PARAMS_PARSER, JAVACC.
jdbc_query_id_generator=A java.util.function.Supplier<String> object that generates query IDs. Set it with Properties.put(). When it is not set, the driver uses random UUIDs.
remember_last_set_roles=Keeps the roles of the last SET ROLE statement and applies them to the next queries of the connection.
custom_http_params=Deprecated. Comma-separated key=value server settings. Use properties with the clickhouse_setting_ prefix.
custom_settings=Deprecated. Comma-separated key=value server settings. Use properties with the clickhouse_setting_ prefix.
use_server_time_zone_for_dates=Deprecated. The driver ignores this property.
http_connection_provider=Deprecated. The driver ignores this property.
jdbc_cluster_name=Cluster name. When it is set, the driver cancels a statement with KILL QUERY ON CLUSTER.
jdbc_type_mappings=Comma-separated type=class mappings for ResultSet.getObject(). Example: UInt64=java.lang.String.
typeMappings=Deprecated. Use jdbc_type_mappings.
jdbc_json_parser_factory=Fully qualified class name of the JsonParserFactory for JSONEachRow responses.
jdbc_metrics_recorder=Fully qualified class name of the MetricsRecorder for the metrics of the connection. The class must have a public constructor without arguments.
jdbc_metadata_use_show_statements=Reads database metadata with SHOW DATABASES, SHOW TABLES and DESCRIBE TABLE instead of the system tables.
disable_frameworks_detection=Disables the detection of application frameworks for the User-Agent header.
jdbc_multi_dimensional_array_element_type=Makes Array.getBaseType() and Array.getBaseTypeName() of a multi-dimensional array return the next array level. Set to false to return the innermost type that is not an array.
