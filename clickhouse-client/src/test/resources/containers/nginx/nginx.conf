worker_processes 1;
error_log stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    upstream clickhouse_http {
        hash $http_x_clickhouse_replica_tag consistent;
        server clickhouse-1:18123;
        server clickhouse-2:18123;
        server clickhouse-3:18123;
    }

    server {
        listen 18123;
        client_max_body_size 0;

        location / {
            proxy_pass http://clickhouse_http;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_request_buffering off;
            proxy_buffering off;
        }
    }
}

# TCP passthrough to clickhouse-1, clickhouse-2, and clickhouse-3.
stream {
    proxy_connect_timeout 60s;
    proxy_timeout 24h;

    upstream clickhouse_https {
        server clickhouse-1:8443;
        server clickhouse-2:8443;
        server clickhouse-3:8443;
    }
    upstream clickhouse_tcp {
        server clickhouse-1:9000;
        server clickhouse-2:9000;
        server clickhouse-3:9000;
    }
    upstream clickhouse_tcp_secure {
        server clickhouse-1:9440;
        server clickhouse-2:9440;
        server clickhouse-3:9440;
    }
    upstream clickhouse_mysql {
        server clickhouse-1:9004;
        server clickhouse-2:9004;
        server clickhouse-3:9004;
    }
    upstream clickhouse_postgresql {
        server clickhouse-1:9005;
        server clickhouse-2:9005;
        server clickhouse-3:9005;
    }
    upstream clickhouse_grpc {
        server clickhouse-1:9100;
        server clickhouse-2:9100;
        server clickhouse-3:9100;
    }

    server {
        listen 8443;
        proxy_pass clickhouse_https;
    }
    server {
        listen 9000;
        proxy_pass clickhouse_tcp;
    }
    server {
        listen 9440;
        proxy_pass clickhouse_tcp_secure;
    }
    server {
        listen 9004;
        proxy_pass clickhouse_mysql;
    }
    server {
        listen 9005;
        proxy_pass clickhouse_postgresql;
    }
    server {
        listen 9100;
        proxy_pass clickhouse_grpc;
    }
}
